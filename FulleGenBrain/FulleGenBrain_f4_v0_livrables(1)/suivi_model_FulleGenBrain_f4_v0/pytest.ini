# FulleGenBrain_f4_v0 — préparation à la publication (aucune publication effectuée)

Ce dossier est préparé pour une révision finale et une publication manuelle par son auteur. Aucun dépôt distant n’a été créé, aucun push n’a été exécuté et aucun service externe n’a été contacté.

## Vérifications locales avant publication

1. Décompresser `Dmodel_FulleGenBrain_f4_v0.zip`, `Amodel_FulleGenBrain_f4_v0.zip` et `suivi_model_FulleGenBrain_f4_v0.zip` dans un dossier temporaire; la fusion doit être sans conflit de contenu.
2. Vérifier `deliverables/release_manifest.json` et les fichiers `.sha256` livrés à côté des ZIP.
3. Lire `LICENSE`, `THIRD_PARTY_NOTICES.md` et `docs/LICENCE_ET_REUTILISATION.md`; les modules runtime amont encore inclus restent soumis à leurs propres licences et nécessitent une revue des droits avant redistribution publique.
4. Lire `docs/reports/P13_release_audit.md` et le rapport JSON de validation détaché fourni dans le dossier de livraison.
5. Faire une dernière revue humaine du nom du dépôt, de la description, des métadonnées, de l’historique et des éléments que l’auteur souhaite rendre publics.
6. Créer ou sélectionner le dépôt GitHub à la main, inspecter la prévisualisation des fichiers et cliquer sur publier uniquement après approbation personnelle.

## Contenu de livraison

- `Dmodel_FulleGenBrain_f4_v0.zip` : runtime, CLI, interface locale, exemples et dépendances d’exécution du noyau.
- `Amodel_FulleGenBrain_f4_v0.zip` : rapports d’audit, reçus, logs, manifestes de provenance et preuves; les sources historiques complètes ne sont pas incluses.
- `suivi_model_FulleGenBrain_f4_v0.zip` : checklists, scripts, tests, formalismes de suivi, benchmarks et preuves JSON.
- `P13_clean_extraction_validation.json` : preuve détachée de validation des hashes finaux et de l’extraction propre. Elle est séparée des ZIP pour éviter un hash auto-référentiel.

## Limite source connue

La base héritée MG d’eGenBrain reste `PARTIAL`: `part01` a été vérifié, mais `part02` n’était pas dans la source fournie. Aucun fragment de remplacement n’a été généré. Ce statut n’est pas une conclusion sur la faisabilité générale de FulleGenBrain.
