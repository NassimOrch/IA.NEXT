[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aam-o82"
version = "0.82.0"
description = "AAM O82 ROCA-D runtime"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.scripts]
o82 = "aam_o82.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
